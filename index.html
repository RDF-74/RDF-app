<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b10"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Detailing Manager</title>
<style>
:root{--bg:#070b10;--panel:#111821;--panel2:#16212c;--line:#263442;--text:#f5f8fc;--muted:#8f9dac;--blue:#3aa7ff;--green:#4bd38b;--gold:#f3ca59;--pink:#ff57b7;--red:#ff7b7b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#06090d,#0a1016 45%,#071016);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}header{padding:calc(18px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,rgba(6,9,13,.98),rgba(6,9,13,.88),rgba(6,9,13,.1));backdrop-filter:blur(14px)}h1{margin:0;font-size:30px}h2,h3{margin:0 0 12px}.sub{color:var(--muted);font-size:13px;margin-top:4px}main{padding:8px 14px 20px;max-width:780px;margin:auto}.card{background:linear-gradient(180deg,rgba(23,33,44,.98),rgba(16,24,33,.98));border:1px solid var(--line);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 16px 36px rgba(0,0,0,.22)}.hero{padding:0;overflow:hidden}.hero-media{height:240px;background:linear-gradient(135deg,#182531,#0e151c);position:relative;overflow:hidden}.hero-media img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center center;will-change:transform}.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.68))}.hero-content{position:absolute;left:18px;right:18px;bottom:16px}.hero-title{font-size:27px;font-weight:800}.hero-sub{color:#d0d7df;margin-top:4px}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#10263b;color:#8ed0ff;font-size:12px;font-weight:800;border:1px solid #1e4667}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#0e151d;border:1px solid #263340;border-radius:18px;padding:14px;min-width:0}.metric .label{font-size:11px;color:var(--muted);margin-bottom:7px}.metric b{font-size:20px;white-space:nowrap}.blue{color:var(--blue)}.green{color:var(--green)}.gold{color:var(--gold)}button{border:0;border-radius:16px;padding:14px 16px;font-weight:800;font-size:15px}.primary{background:linear-gradient(135deg,#249cff,#5bb8ff);color:white}.secondary{background:#16212b;color:white;border:1px solid #2a3948}.greenbtn{background:linear-gradient(135deg,#1c6b45,#36a86f);color:white}.ghost{background:transparent;color:var(--blue);padding:5px 0}input,select,textarea{width:100%;background:#0b1117;color:white;border:1px solid #2a3744;border-radius:14px;padding:13px;font-size:16px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}.tab{display:none}.tab.active{display:block}.list-item{padding:13px 0;border-bottom:1px solid #24313d}.list-item:last-child{border-bottom:0}.tiny{font-size:12px}.muted{color:var(--muted)}.result-card{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;background:#0b1219;border:1px solid #263542;border-radius:20px;padding:18px}.big-result{font-size:44px;font-weight:900;line-height:1}.chem-color{color:var(--pink)}.water-color{color:var(--blue)}.fav-chip{display:inline-flex;flex-direction:column;gap:3px;padding:10px 12px;margin:4px;border-radius:14px;background:#0d151d;border:1px solid #283747;color:white}.tag{display:inline-block;font-size:11px;padding:5px 8px;border-radius:999px;background:#152433;color:#92cfff;border:1px solid #284b68;margin-right:5px}.mini-img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#18222c;border:1px solid #2c3a47}.thumb{width:82px;height:68px;border-radius:13px;object-fit:cover;background:#111922;border:1px solid #283543}.progress{height:7px;background:#27313c;border-radius:999px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#31a8ff,#66d09a)}.quick-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.quick-row button{white-space:nowrap;padding:10px 12px}.danger{color:var(--red)}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.photo-preview{height:230px;border-radius:18px;overflow:hidden;background:#0b1218;border:1px solid #2b3946;position:relative;margin-top:10px}
.photo-preview img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center center;will-change:transform}
.slider-row{display:grid;grid-template-columns:86px 1fr 58px;gap:10px;align-items:center;margin-top:12px}
.slider-row span{font-size:13px;color:var(--muted)}
.slider-row output{text-align:right;font-size:13px;color:#dce7f2}
input[type="range"]{padding:0;border:0;background:transparent}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(7,11,16,.95);backdrop-filter:blur(18px);border-top:1px solid #26313d;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}nav button{background:transparent;color:#7c8897;padding:7px 2px;font-size:11px}nav button.active{color:var(--blue)}
</style></head><body>
<header><h1>Detailing Manager</h1><div class="sub">洗車・コーティング・希釈管理</div></header><main>
<section id="home" class="tab active"><div class="card hero"><div class="hero-media"><img id="homeCarImage" alt=""><div class="hero-overlay"></div><div class="hero-content"><span class="pill">MY CAR</span><div class="hero-title" id="homeCar">車両未登録</div><div class="hero-sub" id="homeCoating">コーティング情報なし</div></div></div><div style="padding:14px"><div class="grid3"><div class="metric"><div class="label">最終洗車</div><b class="blue" id="lastWash">—</b></div><div class="metric"><div class="label">最終コーティング</div><b class="gold" id="lastCoat">—</b></div><div class="metric"><div class="label">次回メンテ目安</div><b class="green" id="nextMaint">—</b></div></div></div></div><div class="grid2"><button class="primary" onclick="go('history')">＋ 洗車を記録</button><button class="greenbtn" onclick="go('dilution')">希釈計算</button></div><div class="card"><div class="section-title"><h3>最近の施工</h3><button class="ghost" onclick="go('history')">すべて見る</button></div><div id="recentHistory" class="muted"></div></div><div class="card"><div class="section-title"><h3>ケミカル在庫</h3><button class="ghost" onclick="go('chemicals')">一覧</button></div><div id="homeChemicals" class="muted"></div></div></section>
<section id="dilution" class="tab"><div class="card"><div class="section-title"><h2>希釈計算</h2><button class="ghost" onclick="resetDilution()">リセット</button></div><label>ケミカル</label><select id="dilutionChemical" onchange="applyChemicalPreset()"></select><label>計算モード</label><select id="mode" onchange="calc()"><option value="x">○倍希釈</option><option value="ratio">原液 : 水</option></select><div class="grid2"><div><label>倍率 / 水の比率</label><input id="ratio" type="number" min="1" value="10" oninput="calc()"></div><div><label>作りたい量 (mL)</label><input id="total" type="number" min="1" value="1000" oninput="calc()"></div></div><div class="quick-row" style="margin-top:10px"><button class="secondary" onclick="setRatio(5)">5倍</button><button class="secondary" onclick="setRatio(10)">10倍</button><button class="secondary" onclick="setRatio(20)">20倍</button><button class="secondary" onclick="setTotal(500)">500mL</button><button class="secondary" onclick="setTotal(1000)">1000mL</button><button class="secondary" onclick="setTotal(1500)">1500mL</button></div></div><div class="card"><div class="section-title"><h3>計算結果</h3><span class="muted tiny" id="formulaHint"></span></div><div class="result-card"><div><div class="muted tiny">原液</div><div class="big-result chem-color" id="chem">100</div><div class="chem-color">mL</div></div><div style="font-size:34px;color:#6f7a86">＋</div><div><div class="muted tiny">水</div><div class="big-result water-color" id="water">900</div><div class="water-color">mL</div></div></div><button class="secondary" style="width:100%;margin-top:12px" onclick="saveFavorite()">★ お気に入りに保存</button></div><div class="card"><h3>お気に入り</h3><div id="favorites"></div></div></section>
<section id="cars" class="tab"><div class="card"><h2>車両管理</h2><label>車名</label><input id="carName" placeholder="例：レクサス GS"><label>ボディカラー</label><input id="carColor" placeholder="例：ホワイト"><label>車両写真</label><input id="carImage" type="file" accept="image/*" onchange="previewSelectedCarImage()">
<div class="photo-preview"><img id="carPreview" alt="車両写真プレビュー"></div>
<div class="slider-row"><span>拡大</span><input id="photoZoom" type="range" min="100" max="220" value="100" step="1" oninput="updatePhotoPreview()"><output id="photoZoomOut">100%</output></div>
<div class="slider-row"><span>左右位置</span><input id="photoX" type="range" min="0" max="100" value="50" step="1" oninput="updatePhotoPreview()"><output id="photoXOut">50</output></div>
<div class="slider-row"><span>上下位置</span><input id="photoY" type="range" min="0" max="100" value="50" step="1" oninput="updatePhotoPreview()"><output id="photoYOut">50</output></div>
<button class="secondary" type="button" style="width:100%;margin-top:10px" onclick="resetPhotoPosition()">写真位置をリセット</button>
<label>現在のコーティング</label><input id="carCoating" placeholder="例：ブラックダイヤ"><div class="grid2"><div><label>コーティング施工日</label><input id="coatDate" type="date"></div><div><label>メンテ周期 (日)</label><input id="maintDays" type="number" value="90" min="1"></div></div><button class="primary" style="margin-top:14px;width:100%" onclick="saveCar()">保存</button></div></section>
<section id="history" class="tab"><div class="card"><h2>施工記録</h2><label>日付</label><input id="histDate" type="date"><label>種類</label><select id="histType"><option>洗車</option><option>コーティング</option><option>メンテナンス</option><option>下地処理</option></select><label>使用ケミカル（複数可）</label><div id="chemicalChecks" class="card" style="padding:10px;margin:0;background:#0b1218"></div><label>施工写真</label><input id="histImage" type="file" accept="image/*"><label>メモ</label><textarea id="histMemo" rows="3"></textarea><button class="primary" style="margin-top:14px;width:100%" onclick="addHistory()">記録する</button></div><div class="card"><h3>履歴</h3><div id="historyList"></div></div></section>
<section id="chemicals" class="tab"><div class="card"><h2>ケミカル管理</h2><label>商品名</label><input id="chemName"><label>分類</label><select id="chemType"><option>アルカリ</option><option>酸性</option><option>中性</option><option>鉄粉除去</option><option>脱脂</option><option>コーティング</option><option>QD</option><option>その他</option></select><div class="grid2"><div><label>推奨倍率</label><input id="chemRatio" type="number"></div><div><label>残量 (mL)</label><input id="chemStock" type="number"></div></div><label>ボトル写真</label><input id="chemImage" type="file" accept="image/*"><button class="primary" style="margin-top:14px;width:100%" onclick="addChemical()">登録</button></div><div class="card"><h3>登録済み</h3><div id="chemicalList"></div></div></section>
</main><nav><button data-tab="home" class="active" onclick="go('home')">⌂<br>ホーム</button><button data-tab="cars" onclick="go('cars')">CAR<br>車両</button><button data-tab="history" onclick="go('history')">LOG<br>施工</button><button data-tab="chemicals" onclick="go('chemicals')">CHEM<br>ケミカル</button><button data-tab="dilution" onclick="go('dilution')">CALC<br>希釈</button></nav>
<script>
const $=id=>document.getElementById(id),load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('保存容量がいっぱいです。写真を減らすか、古い記録を削除してください。');return false}},today=()=>new Date().toISOString().slice(0,10);$('histDate').value=today();
function go(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));render();window.scrollTo({top:0,behavior:'smooth'})}function round(n){return Math.round(n*10)/10}function calc(){let m=$('mode').value,r=Math.max(1,+$('ratio').value||1),t=Math.max(0,+$('total').value||0),c,w;if(m==='x'){c=t/r;w=t-c;$('formulaHint').textContent=`${r}倍希釈 = 原液1 : 水${round(r-1)}`}else{c=t/(1+r);w=t-c;$('formulaHint').textContent=`原液1 : 水${r}`}$('chem').textContent=round(c);$('water').textContent=round(w)}function setRatio(v){$('ratio').value=v;calc()}function setTotal(v){$('total').value=v;calc()}function resetDilution(){$('mode').value='x';$('ratio').value=10;$('total').value=1000;$('dilutionChemical').selectedIndex=0;calc()}
function readFile(input){
  return new Promise(resolve=>{
    const f=input.files&&input.files[0];
    if(!f)return resolve('');
    const reader=new FileReader();
    reader.onload=()=>{
      const original=reader.result;
      const img=new Image();
      img.onload=()=>{
        try{
          const MAX=1200;
          let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
          const scale=Math.min(1,MAX/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));

          const canvas=document.createElement('canvas');
          canvas.width=w;
          canvas.height=h;
          const ctx=canvas.getContext('2d');

          // iPhone/Safari は createImageBitmap の imageOrientation を使うと
          // EXIF回転を適用した状態で描画できる。未対応時は通常描画へフォールバック。
          if ('createImageBitmap' in window) {
            createImageBitmap(f,{imageOrientation:'from-image'}).then(bitmap=>{
              canvas.width=Math.max(1,Math.round(bitmap.width*scale));
              canvas.height=Math.max(1,Math.round(bitmap.height*scale));
              ctx.clearRect(0,0,canvas.width,canvas.height);
              ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
              if (bitmap.close) bitmap.close();
              resolve(canvas.toDataURL('image/jpeg',0.72));
            }).catch(()=>{
              ctx.drawImage(img,0,0,w,h);
              resolve(canvas.toDataURL('image/jpeg',0.72));
            });
          } else {
            ctx.drawImage(img,0,0,w,h);
            resolve(canvas.toDataURL('image/jpeg',0.72));
          }
        }catch(e){ resolve(original); }
      };
      img.onerror=()=>resolve(original);
      img.src=original;
    };
    reader.onerror=()=>resolve('');
    reader.readAsDataURL(f);
  })
}let pendingCarImage='';
async function previewSelectedCarImage(){
  const v=await readFile($('carImage'));
  if(v){pendingCarImage=v;$('carPreview').src=v;$('carPreview').style.display='block';updatePhotoPreview()}
}
function updatePhotoPreview(){
  const z=+$('photoZoom').value||100,x=+$('photoX').value||50,y=+$('photoY').value||50;
  $('photoZoomOut').textContent=z+'%';$('photoXOut').textContent=x;$('photoYOut').textContent=y;
  const img=$('carPreview');img.style.objectPosition=`${x}% ${y}%`;img.style.transform=`scale(${z/100})`;
}
function resetPhotoPosition(){$('photoZoom').value=100;$('photoX').value=50;$('photoY').value=50;updatePhotoPreview()}
async function saveCar(){let p=load('car',{}),img=pendingCarImage||await readFile($('carImage'))||p.image||'';if(save('car',{name:$('carName').value,color:$('carColor').value,coating:$('carCoating').value,coatDate:$('coatDate').value,maintDays:+$('maintDays').value||90,image:img,photoZoom:+$('photoZoom').value||100,photoX:+$('photoX').value||50,photoY:+$('photoY').value||50})){pendingCarImage='';go('home')}}async function addHistory(){let a=load('history',[]),s=[...document.querySelectorAll('input[name="histChem"]:checked')].map(x=>x.value),img=await readFile($('histImage'));a.unshift({date:$('histDate').value||today(),type:$('histType').value,chems:s,memo:$('histMemo').value,image:img});save('history',a);$('histMemo').value='';$('histImage').value='';render()}async function addChemical(){let a=load('chemicals',[]),img=await readFile($('chemImage'));a.unshift({name:$('chemName').value,type:$('chemType').value,ratio:+$('chemRatio').value||0,stock:+$('chemStock').value||0,image:img});save('chemicals',a);['chemName','chemRatio','chemStock','chemImage'].forEach(id=>$(id).value='');render()}function saveFavorite(){let f=load('favorites',[]);f.unshift({chem:$('dilutionChemical').value||'未選択',mode:$('mode').value,ratio:+$('ratio').value,total:+$('total').value});save('favorites',f.slice(0,8));render()}function useFavorite(i){let f=load('favorites',[])[i];if(!f)return;$('mode').value=f.mode;$('ratio').value=f.ratio;$('total').value=f.total;[...$('dilutionChemical').options].forEach((o,j)=>{if(o.value===f.chem)$('dilutionChemical').selectedIndex=j});calc()}function deleteFavorite(i){let f=load('favorites',[]);f.splice(i,1);save('favorites',f);render()}function delHistory(i){let a=load('history',[]);a.splice(i,1);save('history',a);render()}function delChem(i){let a=load('chemicals',[]);a.splice(i,1);save('chemicals',a);render()}function daysSince(d){if(!d)return'—';let x=Math.floor((Date.now()-new Date(d+'T00:00:00'))/86400000);return x<0?`${-x}日後`:x===0?'今日':`${x}日前`}function nextMaintText(c){if(!c.coatDate||!c.maintDays)return'—';let d=new Date(c.coatDate+'T00:00:00');d.setDate(d.getDate()+c.maintDays);let x=Math.ceil((d-Date.now())/86400000);return x>=0?`${x}日後`:`${-x}日超過`}function applyChemicalPreset(){let c=load('chemicals',[]).find(x=>x.name===$('dilutionChemical').value);if(c&&c.ratio){$('mode').value='x';$('ratio').value=c.ratio;calc()}}
function render(){let car=load('car',{}),h=load('history',[]),c=load('chemicals',[]),f=load('favorites',[]);$('homeCar').textContent=car.name||'車両未登録';$('homeCoating').textContent=car.coating?`${car.coating}${car.color?' ・ '+car.color:''}`:'コーティング情報なし';let z=car.photoZoom||100,px=car.photoX??50,py=car.photoY??50;if(car.image){$('homeCarImage').src=car.image;$('homeCarImage').style.display='block';$('homeCarImage').style.objectPosition=`${px}% ${py}%`;$('homeCarImage').style.transform=`scale(${z/100})`}else $('homeCarImage').style.display='none';$('carName').value=car.name||'';$('carColor').value=car.color||'';$('carCoating').value=car.coating||'';$('coatDate').value=car.coatDate||'';$('maintDays').value=car.maintDays||90;$('photoZoom').value=z;$('photoX').value=px;$('photoY').value=py;if(car.image){$('carPreview').src=car.image;$('carPreview').style.display='block'}else $('carPreview').style.display='none';updatePhotoPreview();let wash=h.find(x=>x.type==='洗車');$('lastWash').textContent=wash?daysSince(wash.date):'—';$('lastCoat').textContent=car.coatDate?daysSince(car.coatDate):'—';$('nextMaint').textContent=nextMaintText(car);$('recentHistory').innerHTML=h.length?h.slice(0,3).map(x=>`<div class="list-item row">${x.image?`<img class="thumb" src="${x.image}">`:''}<div style="flex:1"><div class="row between"><b>${x.type}</b><span class="muted tiny">${x.date}</span></div><div>${(x.chems||[]).map(q=>`<span class="tag">${q}</span>`).join('')}</div><div class="muted tiny">${x.memo||''}</div></div></div>`).join(''):'まだ記録がありません。';$('historyList').innerHTML=h.length?h.map((x,i)=>`<div class="list-item row">${x.image?`<img class="thumb" src="${x.image}">`:''}<div style="flex:1"><div class="row between"><b>${x.type}</b><span class="muted tiny">${x.date}</span></div><div>${(x.chems||[]).map(q=>`<span class="tag">${q}</span>`).join('')}</div><div class="muted tiny">${x.memo||''}</div><button class="ghost danger tiny" onclick="delHistory(${i})">削除</button></div></div>`).join(''):'<span class="muted">まだありません。</span>';$('chemicalList').innerHTML=c.length?c.map((x,i)=>`<div class="list-item row">${x.image?`<img class="mini-img" src="${x.image}">`:''}<div style="flex:1"><div class="row between"><b>${x.name||'名称なし'}</b><span class="tag">${x.type}</span></div><div class="muted tiny">推奨 ${x.ratio?x.ratio+'倍':'—'} / 残量 ${x.stock||0}mL</div><div class="progress"><i style="width:${Math.min(100,Math.max(0,(x.stock||0)/10))}%"></i></div><button class="ghost danger tiny" onclick="delChem(${i})">削除</button></div></div>`).join(''):'<span class="muted">まだありません。</span>';$('homeChemicals').innerHTML=c.length?c.slice(0,3).map(x=>`<div class="list-item row">${x.image?`<img class="mini-img" src="${x.image}">`:''}<div style="flex:1"><b>${x.name}</b><div class="muted tiny">${x.type} ・ 残量 ${x.stock||0}mL</div><div class="progress"><i style="width:${Math.min(100,Math.max(0,(x.stock||0)/10))}%"></i></div></div></div>`).join(''):'まだ登録がありません。';$('chemicalChecks').innerHTML=c.length?c.map(x=>`<label style="display:flex;align-items:center;gap:10px;color:white"><input type="checkbox" name="histChem" value="${x.name}" style="width:auto"> ${x.name}</label>`).join(''):'<span class="muted tiny">先にケミカルを登録してください。</span>';let sel=$('dilutionChemical'),cur=sel.value;sel.innerHTML='<option value="">未選択</option>'+c.map(x=>`<option value="${x.name}">${x.name}${x.ratio?'（'+x.ratio+'倍）':''}</option>`).join('');if([...sel.options].some(o=>o.value===cur))sel.value=cur;$('favorites').innerHTML=f.length?f.map((x,i)=>`<button class="fav-chip" onclick="useFavorite(${i})"><b>${x.chem}</b><span class="tiny muted">${x.mode==='x'?x.ratio+'倍':'1:'+x.ratio} / ${x.total}mL</span><span class="tiny danger" onclick="event.stopPropagation();deleteFavorite(${i})">削除</span></button>`).join(''):'<span class="muted">まだありません。</span>';calc()}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
